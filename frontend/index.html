<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary App Meta -->
    <title>GhostChat — Ephemeral & Anonymous Real-Time Chat</title>
    <meta name="description" content="Privacy-first, ephemeral group chat with self-destructing files, view-once media, zero signups, and no logs." />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Standard & Apple Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Android / Chrome Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GhostChat" />
    
    <!-- iOS Safari Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GhostChat" />
  </head>
  <body>
    <!-- Blocking theme init: apply dark class before React renders to avoid flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ghostchat_theme');
          // Default to dark if nothing saved
          if (theme === null || theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
